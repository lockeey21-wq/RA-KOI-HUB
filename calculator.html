<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Koi Pond Water Calculator</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>R&A Koi Hub</h1><p>水 • Water Calculator</p><nav><a href="index.html">Home</a><a href="koi.html">Koi Varieties</a><a href="ponds.html">Ponds</a><a href="filtration.html">Filtration</a><a href="plants.html">Plants</a><a href="feeding.html">Feeding</a><a href="winter.html">Winter Care</a><a href="calculator.html">Water Calculator</a><a href="about.html">Our Story</a></nav></header>
<main><section class="hero"><h2>Pond Volume Calculator</h2><p>Enter the internal pond dimensions in metres.</p></section>
<section class="card calculator"><label>Length (m)<input id="l" type="number" step="0.01"></label><label>Width (m)<input id="w" type="number" step="0.01"></label><label>Average depth (m)<input id="d" type="number" step="0.01"></label><button onclick="calc()">Calculate</button><h3 id="result">Volume: —</h3><p id="litres"></p><script>function calc(){const l=+document.getElementById('l').value,w=+document.getElementById('w').value,d=+document.getElementById('d').value;const v=l*w*d;document.getElementById('result').textContent='Volume: '+v.toFixed(2)+' m³';document.getElementById('litres').textContent='Approximately '+(v*1000).toFixed(0)+' litres.';}</script></section></main><footer>R&A Koi Hub • 錦鯉</footer></body></html>
